<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אופק — מחשבון תוחלת חיים</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b68">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אופק">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #f5f2ec; --card: #fffdf9; --ink: #1c2a2e; --muted: #5d6b6f; --line: #ddd6c9;
  --accent: #0e6b68; --accent-ink: #ffffff; --accent-soft: #d9ebe8;
  --pos: #2c7a57; --neg: #b24a35; --warn-bg: #fbf0d9; --warn-ink: #6b4a08; --track: #ebe6db;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12191b; --card: #1a2427; --ink: #e8eeec; --muted: #9aa9a9; --line: #2e3c40;
    --accent: #4fb9b1; --accent-ink: #082422; --accent-soft: #1f3a3a;
    --pos: #62c497; --neg: #e58a73; --warn-bg: #3a2f14; --warn-ink: #f0d795; --track: #253235;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", Arial, sans-serif;
  font-size: 17px; line-height: 1.6;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.brand { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--accent); }
.privacy-chip { font-size: 13px; color: var(--muted); }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.2; margin: 0 0 12px; text-wrap: balance; }
h2 { font-size: 24px; margin: 0 0 4px; }
h3 { font-size: 18px; margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
@media (max-width: 520px) { .card { padding: 18px 16px; } }
.disclaimer { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin: 16px 0; }
.disclaimer strong { font-weight: 700; }

/* התקדמות */
.progress { display: flex; gap: 6px; margin-bottom: 18px; }
.progress div { flex: 1; height: 6px; border-radius: 3px; background: var(--track); }
.progress div.on { background: var(--accent); }
.step-label { font-size: 14px; color: var(--muted); margin-bottom: 2px; }

/* שדות */
.field { margin-top: 20px; }
.field > label, .field > .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { font-size: 14px; color: var(--muted); margin: -2px 0 8px; }
input[type=number], select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.with-unit { display: flex; align-items: center; gap: 8px; max-width: 240px; }
.with-unit span { color: var(--muted); font-size: 14px; white-space: nowrap; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; }
.opt span {
  display: block; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); cursor: pointer; font-size: 15px; user-select: none;
}
.opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.err { color: var(--neg); font-size: 14px; margin-top: 4px; min-height: 0; }
.person { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.person .lbl { font-weight: 600; margin-bottom: 6px; }
.person-grid { display: grid; grid-template-columns: 1.1fr .8fr 1.3fr; gap: 10px; }
@media (max-width: 520px) { .person-grid { grid-template-columns: 1fr 1fr; } .person-grid > :last-child { grid-column: 1 / -1; } }
[hidden] { display: none !important; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
button {
  font: inherit; cursor: pointer; border-radius: 999px; padding: 12px 26px; min-height: 48px;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.primary:hover { filter: brightness(1.08); }

/* תוצאה */
.hero { text-align: center; padding: 8px 0 4px; }
.hero .big { font-size: clamp(64px, 18vw, 104px); font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero .sub { font-size: 19px; margin-top: 8px; }
.delta { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px; background: var(--accent-soft); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.stat { background: var(--bg); border-radius: 12px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: inherit; fill: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-inline-end: 6px; }
.legend i.base { border-top: 2px dashed var(--muted); }
.legend i.band { height: 10px; border: 0; background: var(--accent); border-radius: 3px; }
.legend i.band.wide { opacity: .3; }
.frow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.3fr) 86px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow .name { font-weight: 600; line-height: 1.3; }
.frow .det { font-size: 13px; color: var(--muted); font-weight: 400; }
.frow .track { position: relative; height: 14px; background: var(--track); border-radius: 7px; direction: ltr; }
.frow .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.frow .bar { position: absolute; top: 0; bottom: 0; border-radius: 7px; }
.frow .val { font-variant-numeric: tabular-nums; font-weight: 700; text-align: left; direction: ltr; white-space: nowrap; font-size: 15px; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.bar.pos { background: var(--pos); } .bar.neg { background: var(--neg); }
@media (max-width: 520px) { .frow { grid-template-columns: minmax(0, 1fr) 70px; } .frow .track { grid-column: 1 / -1; order: 3; } }
ul.notes { padding-inline-start: 20px; margin: 0; }
ul.notes li { margin-bottom: 8px; }
details { border-top: 1px solid var(--line); padding: 12px 0; }
details summary { cursor: pointer; font-weight: 600; }
details ol { padding-inline-start: 22px; font-size: 14px; }
details li { margin-bottom: 8px; }
a { color: var(--accent); }
.bioage { display: flex; align-items: center; gap: 18px; background: var(--accent-soft); border-radius: 14px; padding: 16px 18px; margin: 16px 0 4px; flex-wrap: wrap; }
.bionum { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.biotxt { flex: 1; min-width: 200px; }
/* העלאת מסמך */
.upload { margin-top: 20px; padding: 16px; border: 1.5px dashed var(--accent); border-radius: 14px; background: var(--accent-soft); }
.upload .lbl { font-weight: 700; }
.upload .hint { color: var(--ink); opacity: .8; margin: 2px 0 12px; }
.filebtn { position: relative; display: inline-block; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.filebtn span { display: inline-block; padding: 11px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.filebtn:focus-within span { outline: 2px solid var(--ink); outline-offset: 2px; }
.upload details { border: 0; padding: 10px 0 0; }
.upload summary { font-weight: 400; font-size: 15px; }
.upload textarea { width: 100%; margin: 8px 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.upload button { padding: 8px 18px; min-height: 40px; background: var(--card); }
#labresult { font-size: 15px; }
#labresult:not(:empty) { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--card); }
#labresult.warn { background: var(--warn-bg); color: var(--warn-ink); }
#labresult ul { margin: 8px 0 0; padding-inline-start: 20px; }
#labresult .src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.doclist { margin-top: 12px; }
.docrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; background: var(--card); border-radius: 10px; margin-bottom: 6px; }
.docname { flex: 1; min-width: 120px; font-size: 14px; overflow-wrap: anywhere; }
.docrow input[type=date] { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 38px; }
.docrow button { padding: 6px 14px; min-height: 36px; font-size: 14px; }
.impres:not(:empty) { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--card); font-size: 15px; }
.impres.warn { background: var(--warn-bg); color: var(--warn-ink); }
.impres ul { margin: 8px 0 0; padding-inline-start: 20px; }
details.adv { border: 0; padding: 14px 0 0; }
details.adv summary { font-weight: 400; font-size: 15px; color: var(--muted); }
details.adv .upload { margin-top: 10px; }
#install { padding: 4px 12px; min-height: 30px; font-size: 13px; margin-inline-start: 8px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
header.top { flex-wrap: wrap; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#wipe { padding: 4px 12px; min-height: 30px; font-size: 13px; margin-inline-start: 8px; }
.welcome { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin: 4px 0 12px; }
.remember { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; cursor: pointer; }
.remember input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
details.others { border-top: 0; padding-top: 0; }
.orow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.orow .oname { overflow-wrap: anywhere; }
.orow b { font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--track); white-space: nowrap; }
.chip.bad { background: var(--neg); color: #fff; }
.imp { padding: 10px 0; border-bottom: 1px solid var(--line); }
.imptop { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.implbl { font-weight: 600; }
.imptop b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.impbar { height: 8px; background: var(--track); border-radius: 4px; margin: 6px 0; overflow: hidden; }
.impbar div { height: 100%; background: var(--pos); border-radius: 4px; }
.impall { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; margin: 14px 0 10px; }
.impall button { background: var(--card); padding: 8px 18px; min-height: 40px; }
.rng output:not([dir]) { white-space: normal; font-size: 13px; min-width: 96px; }
details.rawtext { border: 0; padding: 0 0 8px; }
details.rawtext summary { font-weight: 400; font-size: 14px; }
details.rawtext pre { max-height: 240px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
details.gtopic { border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin: 10px 0; background: var(--card); }
details.gtopic summary { font-size: 18px; font-weight: 700; padding: 10px 0; }
.gpersonal { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 4px 0 12px; font-size: 15px; }
ol.gacts { padding-inline-start: 22px; margin: 8px 0 14px; }
ol.gacts li { margin-bottom: 12px; }
ol.gacts li div { font-size: 15px; color: var(--muted); }
ul.gsrc { margin: 6px 0 10px; padding-inline-start: 20px; }
ul.gsrc li { margin-bottom: 4px; overflow-wrap: anywhere; }
/* מגמות */
.trow { display: grid; grid-template-columns: minmax(0, 1.3fr) 110px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.trow .name { font-weight: 600; line-height: 1.3; }
.trow .det { font-size: 13px; color: var(--muted); font-weight: 400; }
.trow .det.pos { color: var(--pos); } .trow .det.neg { color: var(--neg); }
.trow .tval { font-variant-numeric: tabular-nums; font-weight: 700; text-align: end; }
.spark { width: 110px; height: 30px; }
.trendest { background: var(--bg); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.estrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
.estrow b { display: block; font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
.estrow span { font-size: 12px; color: var(--muted); }
.estrow i { color: var(--muted); font-style: normal; }
@media (max-width: 520px) { .trow { grid-template-columns: minmax(0, 1fr) 110px; } .trow .tval { grid-column: 1 / -1; text-align: start; } }
/* סימולטור */
.sim { background: var(--bg); border-radius: 14px; padding: 16px; }
.simout { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
.simout b#simAge { display: block; font-size: 40px; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.simdelta { font-size: 15px; padding: 6px 14px; border-radius: 999px; background: var(--card); }
.simrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: center; padding: 8px 0; }
.simrow label { font-weight: 600; font-size: 15px; }
.simrow select { background: var(--card); min-height: 42px; padding: 8px 10px; }
.rng { display: flex; align-items: center; gap: 8px; }
.rng input { flex: 1; min-width: 0; accent-color: var(--accent); direction: ltr; }
.rng output { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; font-size: 14px; }
.rng span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sim > button { margin-top: 10px; padding: 8px 18px; min-height: 40px; }
@media (max-width: 520px) { .simrow { grid-template-columns: 1fr; gap: 4px; } }
@media print { .nav, .privacy-chip { display: none; } body { background: #fff; } .card { border: 0; padding: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">אופק<span>.</span></div>
    <div class="privacy-chip">🔒 הנתונים נשארים במכשיר שלך <button type="button" id="install" hidden>התקנה כאפליקציה</button><button type="button" id="wipe">מחיקת הנתונים</button></div>
  </header>
  <main id="app"></main>
</div>
<script src="data.js"></script>
<script src="model.js"></script>
<script src="labs.js"></script>
<script src="garmin.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
<script>
// התקנה כאפליקציה ועבודה בלי אינטרנט. פועל רק כשהדף מוגש מכתובת http(s), לא בפתיחה ישירה של הקובץ.
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').catch(function () { /* האפליקציה עובדת גם בלי זה */ });
  var btn = document.getElementById('install'), deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.onclick = function () { if (!deferred) return; deferred.prompt(); deferred = null; btn.hidden = true; };
  window.addEventListener('appinstalled', function () { btn.hidden = true; });
})();
</script>
</body>
</html>
